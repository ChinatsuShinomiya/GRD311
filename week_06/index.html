<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ford Landing Page</title>


    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

<style>

        .manifest {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background-image: url(images/manifest.png);
            background-size: cover;
            position: relative;
            background-position: center;
            margin-top: 0;
        }



        .nav{
            display: flex;
            align-items: center;
            flex-direction: row;
            gap: 30px;
            font: 13px;
            margin-top: 30px;
            font-family: "Bebas Neue";
            text-decoration: none;
            color: white;
            justify-content: space-between;
            width: 100%;

            
 
            .ford-oval {
            width: 80px;
            height: 30px;
            margin: 0;
            margin-top: 40px;
            margin-left: 70px;
            }

        }

        .links-left {
            display: flex;
            align-items: left;
            gap: 60px;
            margin-left: 30px;
            margin-top: 40px;
            margin-right: 600px;
        }


        .items {
            padding: 30px;
            flex:auto;

        }

        .links-right {
            display: flex;
            gap: 20px;
            align-items: right;
            padding-right: 50px;
            margin-top: 40px;
            /* flex-wrap:wrap; */
        }


        .info {
            font-family: "Bebas Neue";
            display: flex;
            flex-direction: column;
            padding-left: 100px;
            justify-content: flex-start;
            margin-top: 380px;
            position:absolute;
            color: white;
            gap: -30px;
            }

    </style>


</head>



<body>

    <header class="manifest">
    <nav class="nav">

        <nav class="links-left" style="text-decoration: none; color: white; gap: 100px"> 
            <div>
            <a href="empty">Vehicles</a>
            <a href="empty">Shop</a>
            <a href="empty">Support and Service</a>
            <a href="empty">Ford Pro Solutions</a>
            </div>
        
        </nav>

        <div>
            <nav class="links-right">
            <a href="empty"> <img src="images/search-v2-white.png" alt="Search"> </a>
            <a href="empty"> <img src="images/location-outline-v2-white.png" alt="Location"> </a>
            <a href="empty"> <img src="images/Locate Dealer.png" alt="locate dealer"> </a>
            <a href="empty"> <img src="images/account-outline-v2-white.png" alt="account"> </a>
            <a href="empty"> <img src="images/globe-v2-white.png" alt="globe"> </a>
            </nav>
        </div>
    </nav>

    <div class="info">

        <div> 
            <class="year">
            <p> 2026 </p>
        </div>


        <div>
            <class="escape"></class>

        </div>


        <div>
            <class="price"></class>
            <h2> Starting at $30,350 </h2>
        </div>


        <div>
            <class="details"></class>
            <p> Details </p>
        </div>

    </div>


    <img src="images/search_inventory_btn.png" alt="2025 Escape" style="width: 160px; height: 40px; margin-left: 100px; margin-top: 650px;">
    <img src="images/2025_escape_btn.png" alt="2025 Escape" style="width: 160px; height: 40px; margin-left: 10px; margin-top: 650px;">


</header>

</html>
